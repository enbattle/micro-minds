# CI for micro-minds (PLAN task 0.10, D11): lint + typecheck + test on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch, but let every push to main finish so each
# main commit keeps a complete, trustworthy result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux compiles node-pty from source (no linux prebuilds), so allow some headroom.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # .gitattributes already forces LF (`* text=auto eol=lf`), which wins over autocrlf.
      # This is a cheap guard in case attributes change: Windows runners default to
      # core.autocrlf=true, and CRLF files would fail Biome's format check (lineEnding: lf).
      - name: Disable CRLF conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Install scripts must run: node-pty uses bundled prebuilds on win32/darwin and builds
      # from source on Linux (ubuntu runners ship python3, make and g++).
      - name: Install dependencies
        run: npm ci

      - name: Check (lint, typecheck, test)
        run: npm run check

      # Coverage runs once (Linux); per-glob thresholds live in vitest.config.ts.
      - name: Test coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      # Audits run once (Linux): the lockfile is the same on every OS. Production dependencies
      # ship with the app, so high or critical advisories there block. Dev dependencies (build,
      # lint, test tooling) never run in the shipped app and rarely see untrusted input, so only
      # critical advisories block; lower ones arrive through Dependabot without failing CI.
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high --omit=dev

      - name: Audit all dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=critical

      # The web build (Vite) is cheap, so it runs on every OS to catch platform-specific
      # path issues (D11).
      - name: Build
        run: npm run build

  # Conventional Commits for every commit in the PR and for the PR title
  # (scripts/lint-commits.ts, no third-party action).
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so the base branch and all PR commits are available to `git log`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # On pull_request, HEAD is GitHub's synthetic merge of the PR into the base branch
      # ("Merge <sha> into <sha>"). Nobody wrote it and it never lands, so the range ends at the
      # PR head SHA instead (the merge's second parent, fetched along with it). Starting from the
      # base branch tip, the range is exactly the PR's own commits.
      # Event data reaches the script only through env, never interpolated into `run`
      # (script injection).
      - name: Lint commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lint-commits.ts --range "origin/${BASE_REF}..${HEAD_SHA}"

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/lint-commits.ts --title
